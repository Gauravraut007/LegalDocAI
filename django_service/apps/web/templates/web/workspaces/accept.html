{% extends "web/base.html" %}
{% block title %}Accept invitation · LDIP{% endblock %}
{% block content %}
<div class="container" style="max-width: 520px;">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-3"><i class="bi bi-envelope-open me-2"></i>Accept workspace invitation</h4>
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Invitation token</label>
          <input class="form-control" name="token" value="{{ token }}" required>
          <div class="form-text">Paste the token your workspace admin shared.</div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary">Accept</button>
          <a href="{% url 'web:workspaces' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
