{% extends "web/base.html" %}
{% block title %}New workspace · LDIP{% endblock %}
{% block content %}
<div class="container" style="max-width: 560px;">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-3"><i class="bi bi-plus-circle me-2"></i>Create workspace</h4>
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Name</label>
          {{ form.name }}
          {{ form.name.errors }}
        </div>
        <div class="mb-3">
          <label class="form-label">Plan</label>
          {{ form.plan }}
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary">Create</button>
          <a href="{% url 'web:workspaces' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
