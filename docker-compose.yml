# Development docker-compose for the Legal Document Intelligence Platform.
#
# Services:
#   postgres       - Postgres 15 with both fastapi_db and django_db (multi-db init).
#   redis          - Redis 7 (Celery broker, Channels, SSE pub/sub).
#   fastapi        - FastAPI service (port 8001).
#   celery_worker  - Celery worker (queues: ocr, embed, default).
#   celery_beat    - Celery beat scheduler.
#   django         - Django + DRF + Channels via Daphne (port 8000).
#   flower         - Optional Celery monitoring UI (profile: debug).

services:
  postgres:
    image: postgres:15-alpine
    container_name: ldip_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-fastapi_db,django_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/create_multiple_dbs.sh:/docker-entrypoint-initdb.d/create_multiple_dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ldip_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  fastapi:
    build:
      context: ./fastapi_service
      dockerfile: Dockerfile
    image: ldip/fastapi:dev
    container_name: ldip_fastapi
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${FASTAPI_DB_NAME:-fastapi_db}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${FASTAPI_DB_NAME:-fastapi_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FAISS_INDEX_DIR: /data/faiss
      UPLOAD_DIR: /data/uploads
      PROCESSED_DIR: /data/uploads/processed
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - faiss_data:/data/faiss
      - media_data:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  celery_worker:
    image: ldip/fastapi:dev
    build:
      context: ./fastapi_service
      dockerfile: Dockerfile
    container_name: ldip_celery_worker
    command: celery -A app.workers.tasks worker -l info -Q ocr,embed,default --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${FASTAPI_DB_NAME:-fastapi_db}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${FASTAPI_DB_NAME:-fastapi_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FAISS_INDEX_DIR: /data/faiss
      UPLOAD_DIR: /data/uploads
      PROCESSED_DIR: /data/uploads/processed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - faiss_data:/data/faiss
      - media_data:/data/uploads

  celery_beat:
    image: ldip/fastapi:dev
    build:
      context: ./fastapi_service
      dockerfile: Dockerfile
    container_name: ldip_celery_beat
    command: celery -A app.workers.tasks beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${FASTAPI_DB_NAME:-fastapi_db}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${FASTAPI_DB_NAME:-fastapi_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FAISS_INDEX_DIR: /data/faiss
      UPLOAD_DIR: /data/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - faiss_data:/data/faiss
      - media_data:/data/uploads

  django:
    build:
      context: ./django_service
      dockerfile: Dockerfile
    image: ldip/django:dev
    container_name: ldip_django
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.development
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-django_db}
      DJANGO_DB_USER: ${POSTGRES_USER:-postgres}
      DJANGO_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/0
      FASTAPI_BASE_URL: http://fastapi:8001
      MEDIA_ROOT: /data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz/').status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  flower:
    image: mher/flower:2.0
    container_name: ldip_flower
    profiles: ["debug"]
    command: ["celery", "--broker=redis://redis:6379/1", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  faiss_data:
  media_data:
